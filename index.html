<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Welcome to Auth App</h1>
            <p>Secure authentication made simple</p>
        </header>
        
        <main>
            <div class="cards">
                <div class="card auth-card">
                    <h3>Login</h3>
                    <button onclick="showAuth('login')">Login</button>
                </div>
                <div class="card dashboard-card">
                    <h3>Dashboard</h3>
                    <button onclick="showAuth('dashboard')">Dashboard</button>
                </div>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2026 Auth App. All rights reserved.</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
